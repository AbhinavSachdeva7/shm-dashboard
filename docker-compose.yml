version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shm-db
    environment:
      POSTGRES_USER: shm
      POSTGRES_PASSWORD: shm_secret
      POSTGRES_DB: shm_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shm -d shm_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shm-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://shm:shm_secret@postgres:5432/shm_dashboard
      ADMIN_PASSWORD: changeme123
      SECRET_KEY: your-secret-key-here-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:80
      THINGSPEAK_BASE_URL: https://api.thingspeak.com
      DATA_INGESTION_INTERVAL_SECONDS: 30
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: shm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
